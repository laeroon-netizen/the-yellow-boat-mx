<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    
    <title>The Yellow Boat - Tournesol</title>
<link rel="icon" type="image/png" sizes="1254x1254" href="../static/assets/icons/theYellowBoat.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.5.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div id="main">
	<div id="sidebar">
		<h2> Nos navigations</h2>
		<div id="chapitres">

		</div>
		<div id="voyage-stats">
			<p>{{ distance_totale }} NM parcourus</p>
			<p>{{ etapes|length }} étapes</p>
			<p>{{ duree_totale }} h de navigation</p>
		</div>
	</div>
	<div id="map"></div>
</div>
<div id="bottom-panel">

    <div id="panel-handle"></div>

    <div id="panel-content">

        <div id="titreEtape"></div>

        <div id="infosEtape"></div>

        <div id="resumeEtape"></div>

        <div id="galeriePhotos"></div>

        <div id="galerieVideos"></div>

    </div>

</div>
<div id="lightbox">

    <span id="close">&times;</span>

    <img id="lightbox-image">

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.0/mapbox-gl.js"></script>
<script src="js/map.js"></script>

<script src="{{ url_for('static', filename='js/map.js') }}"></script>

</body>
</html>
